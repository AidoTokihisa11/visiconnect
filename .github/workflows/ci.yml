name: CI

on:
  push:
    branches: [main, dev, preprod, prod, 'chore/**', 'feat/**', 'fix/**', 'seo/**']
  pull_request:
    branches: [main, dev, preprod, prod]

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root deps
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint

  format:
    name: Format check (Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install root deps
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Prettier check
        run: npm run format:check

  test-server:
    name: Server tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install server deps
        working-directory: server
        run: npm install --no-audit --no-fund
      - name: Run tests
        working-directory: server
        run: npm test

  build-client:
    name: Build client (Vite)
    runs-on: ubuntu-latest
    env:
      # Publishable values inlined into the bundle by Vite — public by design.
      # Override per-repo via Settings > Secrets and variables > Actions > Variables.
      VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL || 'https://keen-swan-699.eu-west-1.convex.cloud' }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY || 'pk_live_Y2xlcmsudmlzaW9jb25uZWN0LnBybyQ' }}
      # The prerender needs Chromium and is exercised on the deploy build, not here.
      PUPPETEER_SKIP_DOWNLOAD: '1'
      SKIP_PRERENDER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install client deps
        working-directory: client
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Build
        working-directory: client
        run: npm run build

  audit:
    name: npm audit (high)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit root
        run: npm audit --audit-level=high || true
      - name: Audit server
        working-directory: server
        run: npm audit --audit-level=high || true
      - name: Audit client
        working-directory: client
        run: npm audit --audit-level=high || true
