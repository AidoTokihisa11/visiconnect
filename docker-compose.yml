version: "3.9"

# Compose minimal pour un VPS Hetzner CX22 (2 vCPU / 4 Go RAM).
# Les variables de production sont fournies via le fichier .env (non commit\u00e9).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: visiconnect-api:latest
    container_name: visiconnect-api
    restart: unless-stopped
    env_file: .env
    expose:
      - "5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - visiconnect

  nginx:
    image: nginx:1.27-alpine
    container_name: visiconnect-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - visiconnect

networks:
  visiconnect:
    driver: bridge
